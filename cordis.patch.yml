# Mounts this plugin into the DSH profile's config tree (bundle declaration).
#
# Normally you do not edit this file. Configure both services from
#   DSH -> Plugins -> Plugins -> Web Search & Scrape
# which writes only non-secret options to this profile and stores API keys in the
# DSH credentials store ($DSH_HOME/.credentials.yaml, mode 0600).
#
# For headless / CI deployments the same non-secret options may be written to
#   ~/.dsh-web-search-scrape/config.json
# or supplied as plugin config here:
#   - id: dsh-web-search-scrape
#     name: dsh-web-search-scrape
#     config:
#       searxngUrl: http://127.0.0.1:8080
#       firecrawlUrl: http://127.0.0.1:3002
# Never put an API key value in this file: `searxngApiKeyEnv` / `firecrawlApiKeyEnv`
# are the NAMES of credentials (or of environment variables), not the secret itself.
#
# ---------------------------------------------------------------------------
# Pinning both providers is NOT optional.
#
# The web seam auto-selects a provider only when exactly ONE registered provider is
# available. The shipped DeepSeek search provider reports available whenever a
# credential resolver exists (always), and the shipped plain-HTTP fetch provider is
# always available, so without these two keys every search and fetch would fail with
# WEB_PROVIDER_AMBIGUOUS once this plugin is loaded.
#
# A patch row replaces the targeted row's WHOLE `config`, so both keys are restated
# here. If you patch `web` again in a later layer, restate both.
#
# To disable this plugin, remove the BUNDLE (Plugins -> Web Search & Scrape ->
# Remove) rather than only toggling the row: a disabled row leaves this `web`
# override in place, pinning `searxng`/`firecrawl` while neither provider registers.
# ---------------------------------------------------------------------------
- id: web
  config:
    searchProvider: searxng
    fetchProvider: firecrawl
- insert:
    - id: dsh-web-search-scrape
      name: dsh-web-search-scrape
